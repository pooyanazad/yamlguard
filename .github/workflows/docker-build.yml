name: Docker Build and Push

on:
  schedule:
    - cron: '00 00 1 * *'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Optional tag matching the package version. Empty uses vX.Y.Z plus today (UTC).'
        required: false
        default: ''
        type: string
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  actions: write
  pull-requests: write

concurrency:
  group: yamlguard-docker-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  REGISTRY: docker.io
  IMAGE_NAME: pooyanazad/yamlguard
  TEST_IMAGE: yamlguard:ci

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. SETUP ────────────────────────────────────────────────────────────────
  setup:
    name: 🔧 Setup
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.version.outputs.version }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      publish_release: ${{ steps.version.outputs.publish_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Print current time
        run: |
          echo "Current UTC time: $(date -u)"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Plan release from package version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ inputs.manual_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run releases from main after merging the release PR."
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' \
            | jq -s '.' > published-releases.json
          python3 -m scripts.release_plan --head "$GITHUB_SHA" --event "$EVENT_NAME" \
            --manual-tag "$MANUAL_TAG" --releases published-releases.json --output "$GITHUB_OUTPUT"

      - name: Refuse an already published PyPI version before creating a new release
        if: steps.version.outputs.publish_release == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          python3 -m scripts.pypi_status --version "$PACKAGE_VERSION" --output pypi-status.txt
          if grep -qx 'published=true' pypi-status.txt; then
            echo "::error::This package version already exists on PyPI. Bump __version__ before creating a new release."
            exit 1
          fi

  # ── 2. BUILD ─────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            PACKAGE_VERSION=${{ needs.setup.outputs.package_version }}
            SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2b. IMAGE SIZE CHECK ──────────────────────────────────────────────────────
  image-size-check:
    name: 📏 Image Size Check
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            PACKAGE_VERSION=${{ needs.setup.outputs.package_version }}
            SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha

      - name: Report and enforce image size limit
        run: |
          SIZE_BYTES=$(docker image inspect ${{ env.TEST_IMAGE }} --format='{{.Size}}')
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          SIZE_MB_INT=$(echo "$SIZE_BYTES / 1048576" | bc)
          MAX_MB=700

          echo "## 📏 Docker Image Size" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image  | \`${{ env.TEST_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size   | ${SIZE_MB} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Limit  | ${MAX_MB} MB |" >> $GITHUB_STEP_SUMMARY

          echo "🐳 Image size: ${SIZE_MB} MB (limit: ${MAX_MB} MB)"

          if [ "$SIZE_MB_INT" -gt "$MAX_MB" ]; then
            echo "❌ Image exceeds ${MAX_MB} MB size limit!" >> $GITHUB_STEP_SUMMARY
            echo "❌ FAIL: image is ${SIZE_MB} MB, which exceeds the ${MAX_MB} MB limit."
            exit 1
          else
            echo "✅ Image is within the size limit." >> $GITHUB_STEP_SUMMARY
            echo "✅ PASS: image is within the ${MAX_MB} MB limit."
          fi

  # ── 2c. TRIVY CONTAINER SCAN ─────────────────────────────────────────────────
  trivy-scan:
    name: 🛡️ Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            PACKAGE_VERSION=${{ needs.setup.outputs.package_version }}
            SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan image with Trivy (HIGH & CRITICAL CVEs)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 0 \
            ${{ env.TEST_IMAGE }}

      - name: Display Trivy summary
        if: always()
        run: |
          echo "## 🛡️ Trivy Container Scan" >> $GITHUB_STEP_SUMMARY
          echo "Scanned: \`${{ env.TEST_IMAGE }}\` for HIGH/CRITICAL CVEs." >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.sarif ]; then
            COUNT=$(grep -c '"ruleId"' trivy-results.sarif 2>/dev/null || echo "0")
            if [ "$COUNT" = "0" ]; then
              echo "✅ No HIGH/CRITICAL vulnerabilities found." >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Found **${COUNT}** HIGH/CRITICAL finding(s) — review the SARIF artifact." >> $GITHUB_STEP_SUMMARY
            fi
            echo "Findings: ${COUNT}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif
          retention-days: 30


  # ── 3. LINT & QUALITY ────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint (Ruff & Mypy)
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt -r requirements-test.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Check formatting with ruff
        run: |
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy app.py yamlguard/ --ignore-missing-imports

  # ── 3b. SECURITY AUDIT ───────────────────────────────────────────────────────
  pip-audit:
    name: 🔐 Pip Audit (CVE Scan)
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install --quiet pip-audit

      - name: Run pip-audit (direct deps only)
        # Scan only our pinned direct dependencies — transitive CVEs from
        # third-party packages (e.g. checkov's aiohttp/asteval/ecdsa) are
        # tracked by Dependabot and fixed via automated PRs, not blocked here.
        id: audit
        continue-on-error: true
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-test.txt \
            --requirement requirements-dev.txt \
            --no-deps \
            --format json \
            --output pip-audit-report.json
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-test.txt \
            --requirement requirements-dev.txt \
            --no-deps

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: Summarise audit result
        if: always()
        run: |
          echo "## 🔐 Pip Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            echo "✅ No known vulnerabilities found in direct dependencies." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities found in direct dependencies — review the artifact." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f pip-audit-report.json ]; then
            python3 -c "
          import json, sys
          try:
              data = json.load(open('pip-audit-report.json'))
              vulns = data.get('dependencies', [])
              rows = [(d['name'], d['version'], v['id'], ','.join(v.get('fix_versions',[])) or 'none')
                      for d in vulns for v in d.get('vulns', [])]
              if rows:
                  print('| Package | Version | CVE | Fix |')
                  print('|---------|---------|-----|-----|')
                  for r in rows:
                      print(f'| {r[0]} | {r[1]} | {r[2]} | {r[3]} |')
              else:
                  print('No vulnerabilities found.')
          except Exception as e:
              print(f'Could not parse report: {e}')
          " >> $GITHUB_STEP_SUMMARY
          fi


  # ── 4. APP TESTS ─────────────────────────────────────────────────────────────
  app-tests:
    name: 🔬 App Tests
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt -r requirements-test.txt

      - name: Run pytest with report and coverage gate
        run: |
          set -o pipefail
          python -m pytest tests/ -v \
            --cov=yamlguard --cov=app --cov-fail-under=70 \
            --cov-report=term-missing \
            --junit-xml=test-results.xml \
            --json-report --json-report-file=test-report.json \
            2>&1 | tee pytest-output.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-test-report
          path: |
            test-results.xml
            test-report.json
            pytest-output.txt
          retention-days: 30

      - name: Print test summary
        if: always()
        run: |
          echo "## 🔬 App Test Results" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json, sys
          try:
              with open('test-report.json') as f:
                  r = json.load(f)
              s = r.get('summary', {})
              passed  = s.get('passed', 0)
              failed  = s.get('failed', 0)
              total   = s.get('total', 0)
              duration = round(r.get('duration', 0), 2)
              print(f'| Total | Passed | Failed | Duration |')
              print(f'|---|---|---|---|')
              icon = '✅' if failed == 0 else '❌'
              print(f'| {total} | {passed} | {failed} | {duration}s |')
              if failed > 0:
                  print('')
                  print('### ❌ Failed Tests')
                  for t in r.get('tests', []):
                      if t.get('outcome') == 'failed':
                          print(f'- {t[\"nodeid\"]}')
          except Exception as e:
              print(f'Could not parse report: {e}')
          " >> $GITHUB_STEP_SUMMARY

  # ── 4. DOCKER INTEGRATION TESTS ──────────────────────────────────────────────
  test:
    name: 🧪 Docker Integration Tests
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            PACKAGE_VERSION=${{ needs.setup.outputs.package_version }}
            SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha

      - name: "✅ Clean file — must exit 0"
        run: |
          docker run --rm -v "${{ github.workspace }}:/data" \
            ${{ env.TEST_IMAGE }} /data/tests/fixtures/test3_clean.yaml
          echo "PASS: Clean file exited 0"

      - name: "❌ File with syntax errors — must exit 1"
        run: |
          if docker run --rm -v "${{ github.workspace }}:/data" \
            ${{ env.TEST_IMAGE }} /data/tests/fixtures/test1_issues.yaml; then
            echo "FAIL: Expected exit 1 for file with critical issues, got 0"
            exit 1
          fi
          echo "PASS: Correctly exited 1 for problematic file"

      - name: "🔒 Security scan — must detect HIGH/CRITICAL issues"
        run: |
          OUTPUT=$(docker run --rm -v "${{ github.workspace }}:/data" \
            ${{ env.TEST_IMAGE }} /data/tests/fixtures/security_test1.yaml 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qiE "HIGH|CRITICAL|checkov" \
            && echo "PASS: Security issues detected" \
            || { echo "FAIL: No security issues found in output"; exit 1; }

      - name: "📂 Multi-file — must show combined report"
        run: |
          OUTPUT=$(docker run --rm -v "${{ github.workspace }}:/data" \
            ${{ env.TEST_IMAGE }} \
            /data/tests/fixtures/test3_clean.yaml /data/tests/fixtures/test1_issues.yaml 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Files scanned: 2" \
            && echo "PASS: Combined report with 2 files shown" \
            || { echo "FAIL: Expected 'Files scanned: 2' in output"; exit 1; }

      - name: "📁 Directory scan — must scan all YAML files"
        run: |
          OUTPUT=$(docker run --rm -v "${{ github.workspace }}:/data" \
            ${{ env.TEST_IMAGE }} /data/tests/fixtures/ 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Files scanned:" \
            && echo "PASS: Directory scan ran" \
            || { echo "FAIL: Expected 'Files scanned:' in output"; exit 1; }

      - name: "--help — must print usage"
        run: |
          OUTPUT=$(docker run --rm ${{ env.TEST_IMAGE }} --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi "usage\|FILE" \
            && echo "PASS: --help output is valid" \
            || { echo "FAIL: --help output unexpected"; exit 1; }

      - name: "--version — must print version number"
        run: |
          OUTPUT=$(docker run --rm ${{ env.TEST_IMAGE }} --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "yamlguard" \
            && echo "PASS: --version output is valid" \
            || { echo "FAIL: --version output unexpected"; exit 1; }

      - name: "Mounted source must not override the image's CLI"
        run: |
          DATA_DIR=$(mktemp -d)
          trap 'rm -rf "$DATA_DIR"' EXIT
          chmod 755 "$DATA_DIR"
          echo 'raise RuntimeError("Mounted yamlguard.py must not be imported")' > "$DATA_DIR/yamlguard.py"
          docker run --rm -v "$DATA_DIR:/data:ro" "${{ env.TEST_IMAGE }}" --version

  # ── 4. [RELEASE] PUSH DOCKER IMAGE ───────────────────────────────────────────
  release-image:
    name: 🚀 [Release] Push Docker Image
    runs-on: ubuntu-latest
    needs: [setup, lint, pip-audit, app-tests, test, image-size-check, trivy-scan]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Protect existing versioned image on release retries
        id: image
        if: needs.setup.outputs.publish_release == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" > image-inspect.txt 2> image-inspect-error.txt; then
            CONFIGS=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{json .Image}}')
            AMD64=$(echo "$CONFIGS" | jq -r '."linux/amd64".config.Labels["org.opencontainers.image.revision"] // empty')
            ARM64=$(echo "$CONFIGS" | jq -r '."linux/arm64".config.Labels["org.opencontainers.image.revision"] // empty')
            if [ "$AMD64" != "$GITHUB_SHA" ] || [ "$ARM64" != "$GITHUB_SHA" ]; then
              echo "::error::Docker tag already exists with a different or unknown source revision. Choose a new package version."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing the existing versioned image for this commit." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qi 'manifest unknown\|not found' image-inspect-error.txt; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          else
            cat image-inspect-error.txt >&2
            exit 1
          fi

      - name: Push multi-arch image (amd64 + arm64)
        if: steps.image.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            PACKAGE_VERSION=${{ needs.setup.outputs.package_version }}
            SOURCE_REVISION=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ needs.setup.outputs.publish_release == 'true' && format('{0}:{1}', env.IMAGE_NAME, needs.setup.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. [RELEASE] RELEASE NOTES ───────────────────────────────────────────────
  release-notes:
    name: 📝 [Release] Release Notes
    runs-on: ubuntu-latest
    needs: [setup, release-image]
    if: needs.setup.outputs.publish_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Generate release report and README notes
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          PREV_TAG: ${{ needs.setup.outputs.latest_tag }}
        run: |
          python3 scripts/release_notes.py \
            --version "$VERSION" --head "$GITHUB_SHA" \
            --previous-tag "$PREV_TAG" \
            --repository "$GITHUB_REPOSITORY" --image "$IMAGE_NAME" \
            --readme README.md --output release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-body.md
          retention-days: 30

      - name: Commit and push README
        env:
          RELEASE_BRANCH: release-notes/${{ needs.setup.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes"
          else
            git checkout -b "$RELEASE_BRANCH"
            git commit -m "docs: update release notes for ${{ needs.setup.outputs.version }}"
            git push --force-with-lease origin "$RELEASE_BRANCH"
          fi

      - name: Open release notes pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: release-notes/${{ needs.setup.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            if ! gh pr view "$RELEASE_BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if ! gh pr create --repo "$GITHUB_REPOSITORY" \
                --base main --head "$RELEASE_BRANCH" \
                --title "docs: update release notes for ${{ needs.setup.outputs.version }}" \
                --body "Automated update of the README latest-release block. GITHUB_TOKEN cannot trigger PR checks: close and reopen this PR with your own account to start CI, then merge after checks pass."; then
                echo "::warning::README branch pushed, but the PR could not be opened. Enable 'Allow GitHub Actions to create and approve pull requests' in repository Actions settings, or open the PR manually."
                echo "README update requires a PR: https://github.com/$GITHUB_REPOSITORY/compare/main...$RELEASE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "No README changes; skipping PR."
          fi

  # ── 6. [RELEASE] GITHUB PACKAGE ──────────────────────────────────────────────
  release-package:
    name: 📦 [Release] GitHub Package
    runs-on: ubuntu-latest
    needs: [setup, release-notes]
    if: needs.setup.outputs.publish_release == 'true'
    steps:
      - name: Download release report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.setup.outputs.version }}
          body_path: release-body.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger PyPI release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$VERSION"
          echo "PyPI workflow dispatched for $VERSION; check its result separately." >> "$GITHUB_STEP_SUMMARY"

  # ── 7. SUMMARY ───────────────────────────────────────────────────────────────
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [setup, build, lint, pip-audit, app-tests, test, image-size-check, trivy-scan, release-image, release-notes, release-package]
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## 🐳 yamlguard Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Setup | ${{ needs.setup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Lint (Ruff & Mypy) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Pip Audit (CVE Scan) | ${{ needs.pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 App Tests | ${{ needs.app-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Docker Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📏 Image Size Check | ${{ needs.image-size-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Trivy Container Scan | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Push Image | ${{ needs.release-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Release Notes | ${{ needs.release-notes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 GitHub Package | ${{ needs.release-package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.setup.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Creates a new release:** ${{ needs.setup.outputs.publish_release }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.setup.outputs.publish_release }}" = "true" ]; then
            echo "**Planned release image:** \`${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.version }}\` (see Push Image result above)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "**Rolling image:** \`${{ env.IMAGE_NAME }}:latest\` (no new GitHub/PyPI release)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**CI image:** \`${{ env.TEST_IMAGE }}\` (no publication)." >> "$GITHUB_STEP_SUMMARY"
          fi

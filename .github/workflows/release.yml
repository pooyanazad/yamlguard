name: Release & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag (vX.Y.Z or vX.Y.Z-YYYYMMDD)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yamlguard-pypi-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release and publication status
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      published: ${{ steps.pypi.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate existing release and matching package version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # Parse before using the supplied tag as a Git revision.
          python3 -c 'import os; from scripts.release_notes import tag_key; tag_key(os.environ["RELEASE_TAG"])'
          DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$DRAFT" != "false" ]; then
            echo "::error::Publish a GitHub release before publishing its package."
            exit 1
          fi
          SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          PACKAGE_VERSION=$(python3 -c 'import os; from scripts.release_plan import validate_tag; print(validate_tag(os.environ["RELEASE_TAG"], "refs/tags/" + os.environ["RELEASE_TAG"]))')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check PyPI without hiding HTTP or network errors
        id: pypi
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        run: |
          python3 -m scripts.pypi_status --version "$PACKAGE_VERSION" --output "$GITHUB_OUTPUT"
          echo "Package: yamlguard $PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize publication plan
        env:
          PUBLISHED: ${{ steps.pypi.outputs.published }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            echo "Already present on PyPI; upload skipped and existing files left unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not yet on PyPI; tests, build and publication follow. Check the Publish to PyPI job for the result." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── 1. Run full test suite before publishing ──────────────────────────────
  test:
    name: Test before release
    needs: preflight
    if: needs.preflight.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: pip install -e . -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v

  # ─── 2. Build the distribution packages ───────────────────────────────────
  build:
    name: Build wheel & sdist
    runs-on: ubuntu-latest
    needs: [preflight, test]
    outputs:
      dist_path: dist/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build hatchling

      - name: Build packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # The packaged README uses the same range and highlights as GitHub.
          python scripts/release_notes.py --version "$RELEASE_TAG" --head HEAD \
            --repository "$GITHUB_REPOSITORY" --readme README.md
          python -m build

      - name: Generate SHA256 checksums
        run: |
          sha256sum dist/* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-checksums
          path: SHA256SUMS.txt
          retention-days: 30

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-release
          path: dist/
          retention-days: 30

  # ─── 3. Publish to PyPI via Trusted Publisher (OIDC) ─────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/yamlguard
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Using PyPI Trusted Publisher — no PYPI_TOKEN needed!
          # Set up at: https://pypi.org/manage/account/publishing/
          print-hash: true

      - name: Record successful publication
        run: |
          echo "PyPI publication completed: https://pypi.org/project/yamlguard/" >> "$GITHUB_STEP_SUMMARY"
